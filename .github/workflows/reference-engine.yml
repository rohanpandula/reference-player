name: Reference Player engine patch

on:
  pull_request:
    paths:
      - 'PrivateBuild/**'
      - 'ReferencePlayer.xcworkspace/**'
      - 'Rivulet.xcodeproj/**'
      - '.github/workflows/reference-engine.yml'
  push:
    branches: [main]
    paths:
      - 'PrivateBuild/**'
      - 'ReferencePlayer.xcworkspace/**'
      - 'Rivulet.xcodeproj/**'
      - '.github/workflows/reference-engine.yml'

concurrency:
  group: reference-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare private engine and placeholder configuration
        run: |
          python3 PrivateBuild/engine.py
          sed 's/"YOUR_SENTRY_DSN_HERE"/""/' RivuletCore/Config/Secrets.swift.template > RivuletCore/Config/Secrets.swift
          python3 PrivateBuild/check.py --quick
      - name: Engine regressions with optional components
        run: swift test --package-path PrivateBuild/.build/AetherEngine --enable-all-traits --filter 'Dovi|DualLayer|FrameSideData'
      - name: Engine regressions without optional components
        run: swift test --package-path PrivateBuild/.build/AetherEngine --filter DoviRpuConverterTests
      - name: Patched app integration
        run: python3 PrivateBuild/check.py --all
